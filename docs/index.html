<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TezCrypt - Web Encryption Tool</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>TezCrypt</h1>
            <p class="subtitle">Modular Encryption/Decryption Utility</p>
        </header>

        <main>
            <div class="section split-row">
                <div class="form-group">
                    <label for="algorithm">Algorithm:</label>
                    <select id="algorithm" class="select-input"></select>
                </div>
                <button id="uploadBtn" class="btn btn-tertiary">Upload File</button>
            </div>

            <div class="section split-row">
                <div class="form-group">
                    <label for="subAlgorithm">Sub-algorithm:</label>
                    <select id="subAlgorithm" class="select-input">
                        <option value="simple">Simple</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="variant">Variant:</label>
                    <select id="variant" class="select-input">
                        <option value="A">A</option>
                        <option value="B">B</option>
                        <option value="C">C</option>
                    </select>
                </div>

                <button id="wrapBtn" class="btn btn-secondary">Wrap Tag</button>
            </div>

            <input id="fileInput" type="file" hidden />

            <div class="section">
                <label for="inputText">Input Text:</label>
                <textarea 
                    id="inputText" 
                    class="text-area" 
                    placeholder="Enter text to encrypt or decrypt..."
                    spellcheck="false"></textarea>
            </div>

            <div class="section">
                <div class="button-group">
                    <button id="encryptBtn" class="btn btn-primary">Encrypt</button>
                    <button id="decryptBtn" class="btn btn-primary">Decrypt</button>
                </div>
            </div>

            <div class="section">
                <label for="outputText">Output Text:</label>
                <textarea 
                    id="outputText" 
                    class="text-area text-area-readonly" 
                    placeholder="Result will appear here..."
                    readonly
                    spellcheck="false"></textarea>
                <button id="copyBtn" class="btn btn-secondary">Copy Result</button>
            </div>

            <footer class="info-section">
                <p><strong>Note:</strong> Use the Wrap Tag button to insert algorithm wrapper markers into the input. This enables tagged encryption with trailer metadata for safe round-trip decryption.</p>
                <p><a href="https://github.com/Darkspeen/TezCrypt" target="_blank">View on GitHub</a> | <a href="https://github.com/Darkspeen/TezCrypt#readme" target="_blank">Documentation</a></p>
            </footer>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
